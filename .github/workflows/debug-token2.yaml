name: Debug Token Info 2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token to find installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check rate limit header to see X-OAuth-Client-ID
          echo "=== Rate limit headers ==="
          curl -s -I -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit 2>&1 | grep -i "x-oauth\|x-github\|x-rate\|x-app" | head -20

          echo ""
          echo "=== /installation/repositories ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/installation/repositories?per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('total_count:', d.get('total_count'), 'selection:', d.get('repository_selection'))"
