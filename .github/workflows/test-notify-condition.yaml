name: Test notify condition

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which scenario to test"
        required: true
        type: choice
        options:
          - failure
          - failure-then-cancel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deploy failure
        run: exit 1

  slow-job:
    needs: [deploy]
    if: ${{ always() && inputs.scenario == 'failure-then-cancel' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sleep (cancel the workflow while this is running)
        run: sleep 120

  notify-failure:
    needs: [deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "fired — if: failure()"

  notify-always-failure:
    needs: [deploy]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "fired — if: always() && failure()"

  notify-always-contains:
    needs: [deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "fired — if: always() && contains(needs.*.result, 'failure')"

  summary:
    if: ${{ always() }}
    needs:
      - notify-failure
      - notify-always-failure
      - notify-always-contains
    runs-on: ubuntu-latest
    steps:
      - name: Print results
        run: |
          echo "notify-failure:           ${{ needs.notify-failure.result }}"
          echo "notify-always-failure:    ${{ needs.notify-always-failure.result }}"
          echo "notify-always-contains:   ${{ needs.notify-always-contains.result }}"
