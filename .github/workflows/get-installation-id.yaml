name: Get Installation ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-latest
    steps:
      - name: Decode ACTIONS_RUNTIME_TOKEN to find installation ID
        run: |
          echo "=== ACTIONS_RUNTIME_TOKEN payload ==="
          python3 << 'PYEOF'
          import os, base64, json
          token = os.environ.get('ACTIONS_RUNTIME_TOKEN', '')
          if not token:
              print("ACTIONS_RUNTIME_TOKEN not set")
          else:
              parts = token.split('.')
              print(f"Token parts: {len(parts)}, length: {len(token)}")
              if len(parts) >= 2:
                  payload = parts[1]
                  payload += '=' * (4 - len(payload) % 4)
                  try:
                      decoded = json.loads(base64.urlsafe_b64decode(payload))
                      print(json.dumps(decoded, indent=2))
                  except Exception as e:
                      print(f"Decode error: {e}")
                      print(f"Prefix: {token[:30]}")
          PYEOF
