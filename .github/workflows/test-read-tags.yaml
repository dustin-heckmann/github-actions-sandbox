name: Test Read Deployment Tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Fetch and print all deployed/* tags
        run: |
          git fetch --tags
          echo "=== All deployed/* tags ==="
          found=0
          for tag in $(git tag -l 'deployed/*'); do
            sha=$(git rev-parse "$tag")
            echo "  $tag -> $sha"
            found=1
          done
          if [ $found -eq 0 ]; then
            echo "  (no deployed/* tags found)"
          fi
          echo "=== Read access verified ==="
