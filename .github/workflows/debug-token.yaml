name: Debug Token Info

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get installation info via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use GITHUB_TOKEN to call the API and see what installation context we're running under
          echo "=== Checking repos accessible to this installation ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/installation/repositories?per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('installation response keys:', list(d.keys()))"

          echo ""
          echo "=== App context ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/installation" \
            -H "Accept: application/vnd.github+json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ['id','app_id','app_slug'] if k in d}, indent=2))" 2>/dev/null || echo "(endpoint not available)"

          echo ""
          echo "=== Token type check ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/app/installations" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d if isinstance(d,dict) else d[0:1], indent=2))" 2>/dev/null | head -10
